name: HRIS Clock Out

on:
  schedule:
    - cron: "40 3 * * 2-6" # 3:40 AM UTC is 11:40 AM Philippine Time
  workflow_dispatch: # manual trigger mode

concurrency:
  group: hris-clockout
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Prevent duplicate run
        run: |
          FILE=".last-run-clockout"
          TODAY=$(date +%Y-%m-%d)

          if [ -f "$FILE" ] && grep -q "$TODAY" "$FILE"; then
            echo "Already ran today. Exiting."
            exit 0
          fi

          echo $TODAY > $FILE

      - name: Run Clock In automation
        env:
          SPROUT_USERNAME: ${{ secrets.SPROUT_USERNAME }}
          SPROUT_PASSWORD: ${{ secrets.SPROUT_PASSWORD }}
        run: npx playwright test tests/clockIn.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
