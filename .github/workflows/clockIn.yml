name: HRIS Clock In

on:
  schedule:
    - cron: "20 3 * * 2-6" # 3:20 AM UTC = 11:20 AM Philippine Time (Tue - Sat)
  workflow_dispatch: # manual trigger mode

concurrency:
  group: hris-clockin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run Clock In automation
        env:
          SPROUT_USERNAME: ${{ secrets.SPROUT_USERNAME }}
          SPROUT_PASSWORD: ${{ secrets.SPROUT_PASSWORD }}
        run: npx playwright test tests/clockIn.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
